<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedMCQ</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F4EF;
    --surface: #FFFFFF;
    --surface2: #F0EDE7;
    --border: rgba(0,0,0,0.1);
    --text: #1A1814;
    --text2: #6B6560;
    --text3: #9E9892;
    --accent: #C4472A;
    --correct: #2D7A4F;
    --correct-light: #EAF5EF;
    --wrong: #C4472A;
    --wrong-light: #FAEAE6;

    --surgery: #7B3F9E;           --surgery-bg: #F3EBF9;
    --cardiology: #2456A4;        --cardiology-bg: #EAF0FB;
    --gastrohepatology: #A0691A;  --gastrohepatology-bg: #FBF0E0;
    --pulmonology: #1A8A8A;       --pulmonology-bg: #E5F6F6;
    --nephrology: #2D7A4F;        --nephrology-bg: #EAF5EF;
    --obstetrics: #C4477A;        --obstetrics-bg: #FAEAF1;
    --gynaecology: #7A3030;       --gynaecology-bg: #F9EAEA;
  }

  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.6; }

  .screen { display: none; }
  .screen.active { display: block; }

  .page-header {
    padding: 28px 32px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0; z-index: 10;
  }
  .logo { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--text); letter-spacing: -0.3px; }
  .logo em { color: var(--accent); font-style: italic; }
  .page-sub { font-size: 12px; color: var(--text3); margin-top: 2px; font-weight: 300; }

  /* HOME */
  .home-body { padding: 24px 32px; }
  .section-label { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); margin-bottom: 14px; }
  .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; }
  .topic-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 16px; cursor: pointer;
    text-align: left; transition: all 0.15s;
  }
  .topic-card:hover { border-color: rgba(0,0,0,0.2); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
  .topic-card:active { transform: translateY(0); }
  .topic-icon { font-size: 22px; display: block; margin-bottom: 10px; }
  .topic-name { font-size: 13px; font-weight: 500; color: var(--text); display: block; }
  .topic-meta { font-size: 11px; color: var(--text3); margin-top: 3px; display: block; }
  .topic-pill { display: inline-block; font-size: 9px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; margin-top: 8px; }

  /* SUBTOPIC */
  .sub-body { padding: 24px 32px; max-width: 700px; }
  .back-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .back-btn {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 14px; font-size: 12px; color: var(--text2); cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: all 0.15s; white-space: nowrap;
  }
  .back-btn:hover { border-color: rgba(0,0,0,0.3); color: var(--text); }
  .screen-title { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--text); }
  .subtopic-list { display: flex; flex-direction: column; gap: 8px; }
  .subtopic-row {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 15px 18px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; transition: all 0.15s;
  }
  .subtopic-row:hover { border-color: rgba(0,0,0,0.2); background: var(--surface2); }
  .subtopic-row.disabled { opacity: 0.38; cursor: default; }
  .subtopic-row.disabled:hover { border-color: var(--border); background: var(--surface); }
  .sub-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .sub-count { font-size: 12px; color: var(--text3); }
  .sub-count.has-q { color: var(--correct); font-weight: 500; }

  .num-section { margin-top: 28px; }
  .num-label { font-size: 12px; color: var(--text2); margin-bottom: 10px; }
  .num-options { display: flex; gap: 8px; flex-wrap: wrap; }
  .num-btn {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 16px; font-size: 13px;
    font-weight: 500; cursor: pointer; color: var(--text2);
    font-family: 'DM Sans', sans-serif; transition: all 0.15s;
  }
  .num-btn.active { background: var(--text); color: #fff; border-color: var(--text); }
  .num-btn:hover:not(.active) { border-color: rgba(0,0,0,0.25); }

  .start-all-btn {
    margin-top: 20px; width: 100%;
    background: var(--text); color: #fff; border: none;
    border-radius: 10px; padding: 13px;
    font-size: 14px; font-weight: 500; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: opacity 0.15s;
  }
  .start-all-btn:hover { opacity: 0.85; }
  .start-all-btn:disabled { opacity: 0.3; cursor: default; }

  /* QUIZ */
  .quiz-wrap { max-width: 640px; margin: 0 auto; padding: 28px 24px; }
  .quiz-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .quiz-tag { font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 20px; }
  .progress-info { font-size: 12px; color: var(--text3); }
  .progress-track { height: 2px; background: var(--border); border-radius: 2px; margin-bottom: 28px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }

  .q-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; margin-bottom: 14px; }
  .q-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .q-num { font-size: 11px; color: var(--text3); letter-spacing: 0.04em; }
  .q-subtopic-tag { font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 20px; }
  .past-paper-badge {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 500;
    background: #FBF0E0; color: #A0691A;
    border: 1px solid rgba(160,105,26,0.25);
    padding: 2px 8px; border-radius: 20px;
  }
  .q-text { font-family: 'DM Serif Display', serif; font-size: 20px; line-height: 1.4; color: var(--text); }

  .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .opt-btn {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; text-align: left; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text);
    transition: all 0.15s; display: flex; align-items: flex-start; gap: 10px;
  }
  .opt-btn:hover:not(:disabled) { border-color: rgba(0,0,0,0.22); background: var(--surface2); }
  .opt-btn:disabled { cursor: default; }
  .opt-btn.correct { background: var(--correct-light); border-color: var(--correct); color: var(--correct); }
  .opt-btn.wrong { background: var(--wrong-light); border-color: var(--wrong); color: var(--wrong); }
  .opt-letter {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--surface2); border: 1px solid var(--border);
    font-size: 11px; font-weight: 500; color: var(--text2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px; transition: all 0.15s;
  }
  .opt-btn.correct .opt-letter { background: var(--correct); border-color: var(--correct); color: #fff; }
  .opt-btn.wrong .opt-letter { background: var(--wrong); border-color: var(--wrong); color: #fff; }

  .explanation {
    background: var(--surface2); border-left: 3px solid var(--accent);
    border-radius: 0 10px 10px 0; padding: 14px 16px;
    font-size: 13px; color: var(--text2); line-height: 1.65;
    margin-bottom: 14px; display: none;
  }
  .explanation.show { display: block; }
  .explanation strong { color: var(--text); font-weight: 500; }

  .next-btn {
    width: 100%; background: var(--text); color: #fff; border: none;
    border-radius: 10px; padding: 13px; font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: opacity 0.15s; display: none;
  }
  .next-btn.show { display: block; }
  .next-btn:hover { opacity: 0.85; }

  /* RESULTS */
  .results-wrap { max-width: 560px; margin: 0 auto; padding: 40px 24px; }
  .results-header { text-align: center; margin-bottom: 36px; }
  .results-score { font-family: 'DM Serif Display', serif; font-size: 72px; color: var(--text); line-height: 1; }
  .results-score span { color: var(--accent); }
  .results-sub { font-size: 14px; color: var(--text2); margin-top: 6px; }
  .results-grade { display: inline-block; margin-top: 12px; font-size: 13px; font-weight: 500; padding: 5px 16px; border-radius: 20px; }
  .review-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
  .review-q { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 8px; }
  .review-correct { font-size: 12px; color: var(--correct); }
  .review-wrong { font-size: 12px; color: var(--wrong); margin-bottom: 2px; }
  .results-actions { display: flex; gap: 10px; margin-top: 24px; }
  .results-actions button { flex: 1; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .btn-primary { background: var(--text); color: #fff; border: none; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: rgba(0,0,0,0.3); }
</style>
</head>
<body>

<!-- HOME -->
<div id="screen-home" class="screen active">
  <div class="page-header">
    <div class="logo">Med<em>MCQ</em></div>
    <div class="page-sub">Select a specialty to begin</div>
  </div>
  <div class="home-body">
    <div class="section-label">Specialties</div>
    <div class="topic-grid" id="topic-grid"></div>
  </div>
</div>

<!-- SUBTOPIC -->
<div id="screen-subtopic" class="screen">
  <div class="page-header">
    <div class="logo">Med<em>MCQ</em></div>
  </div>
  <div class="sub-body">
    <div class="back-row">
      <button class="back-btn" id="sub-back">← Specialties</button>
      <div class="screen-title" id="sub-title"></div>
    </div>
    <div class="section-label">Subtopics</div>
    <div class="subtopic-list" id="subtopic-list"></div>
    <div class="num-section">
      <div class="num-label">Questions per session</div>
      <div class="num-options">
        <button class="num-btn" data-n="5">5</button>
        <button class="num-btn active" data-n="10">10</button>
        <button class="num-btn" data-n="15">15</button>
        <button class="num-btn" data-n="20">20</button>
        <button class="num-btn" data-n="0">All</button>
      </div>
    </div>
    <button class="start-all-btn" id="start-all-btn">Start all questions →</button>
  </div>
</div>

<!-- QUIZ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-wrap">
    <div class="quiz-top">
      <button class="back-btn" id="quiz-back">← Back</button>
      <span class="quiz-tag" id="quiz-tag"></span>
      <span class="progress-info" id="progress-info"></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div id="quiz-body"></div>
  </div>
</div>

<!-- RESULTS -->
<div id="screen-results" class="screen">
  <div class="results-wrap">
    <div class="results-header">
      <div class="results-score" id="results-score"></div>
      <div class="results-sub" id="results-sub"></div>
      <div class="results-grade" id="results-grade"></div>
    </div>
    <div class="section-label" style="margin-bottom:14px;">Review</div>
    <div id="results-review"></div>
    <div class="results-actions">
      <button class="btn-secondary" id="btn-topics">← Specialties</button>
      <button class="btn-primary" id="btn-retry">Try again ↗</button>
    </div>
  </div>
</div>

<script>
const TOPIC_META = {
  surgery:          { icon: '🔪', desc: 'Hepatobiliary, GI, vascular' },
  cardiology:       { icon: '🫀', desc: 'ECG, arrhythmias, ACS' },
  gastrohepatology: { icon: '🫁', desc: 'GI tract, liver, pancreas' },
  pulmonology:      { icon: '🌬️', desc: 'Respiratory, airways' },
  nephrology:       { icon: '🫘', desc: 'Kidneys, electrolytes' },
  obstetrics:       { icon: '🤱', desc: 'Pregnancy, labour, delivery' },
  gynaecology:      { icon: '🩺', desc: 'Menstrual, oncology, fertility' },
};

let bank = {};
let selectedNum = 10;
let activeTopic = null;
let questions = [];
let currentQ = 0;
let answers = [];
let answered = false;
let retryContext = null;

async function init() {
  try {
    const res = await fetch('questions.json?v=' + new Date().toISOString().slice(0,16));
    const data = await res.json();
    bank = data.topics || {};
  } catch(e) { bank = {}; }
  renderHome();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0, 0);
}

function countTopicQuestions(topic) {
  return Object.values(topic.subtopics || {}).reduce((sum, arr) => sum + arr.length, 0);
}

function renderHome() {
  const grid = document.getElementById('topic-grid');
  grid.innerHTML = '';
  Object.entries(bank).forEach(([id, topic]) => {
    const meta = TOPIC_META[id] || { icon: '📋', desc: '' };
    const total = countTopicQuestions(topic);
    const btn = document.createElement('button');
    btn.className = 'topic-card';
    btn.innerHTML = `
      <span class="topic-icon">${meta.icon}</span>
      <span class="topic-name">${topic.label}</span>
      <span class="topic-meta">${meta.desc}</span>
      <span class="topic-pill" style="background:var(--${id}-bg,#f2f2f2);color:var(--${id},#555);">
        ${total} question${total !== 1 ? 's' : ''}
      </span>`;
    btn.addEventListener('click', () => openTopic(id));
    grid.appendChild(btn);
  });
}

function openTopic(topicId) {
  activeTopic = topicId;
  const topic = bank[topicId];
  document.getElementById('sub-title').textContent = topic.label;

  const list = document.getElementById('subtopic-list');
  list.innerHTML = '';

  Object.entries(topic.subtopics || {}).forEach(([name, qs]) => {
    const row = document.createElement('div');
    row.className = 'subtopic-row' + (qs.length === 0 ? ' disabled' : '');
    row.innerHTML = `
      <div class="sub-name">${name}</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="sub-count ${qs.length > 0 ? 'has-q' : ''}">${qs.length} question${qs.length !== 1 ? 's' : ''}</span>
        ${qs.length > 0 ? '<span style="font-size:13px;color:var(--text3)">→</span>' : ''}
      </div>`;
    if (qs.length > 0) row.addEventListener('click', () => startQuiz(qs, name, topicId));
    list.appendChild(row);
  });

  const total = countTopicQuestions(topic);
  const btn = document.getElementById('start-all-btn');
  btn.disabled = total === 0;
  btn.textContent = total > 0 ? `Start all ${total} questions in ${topic.label} →` : 'No questions added yet';
  showScreen('subtopic');
}

document.getElementById('sub-back').addEventListener('click', () => showScreen('home'));
document.getElementById('start-all-btn').addEventListener('click', () => {
  if (!activeTopic) return;
  const topic = bank[activeTopic];
  const all = Object.values(topic.subtopics || {}).flat();
  if (all.length > 0) startQuiz(all, topic.label, activeTopic);
});

document.querySelectorAll('.num-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedNum = parseInt(btn.dataset.n);
  });
});

function startQuiz(pool, label, topicId) {
  retryContext = { pool, label, topicId };
  currentQ = 0; answers = []; answered = false;
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  questions = selectedNum === 0 ? shuffled : shuffled.slice(0, Math.min(selectedNum, shuffled.length));

  const tag = document.getElementById('quiz-tag');
  tag.textContent = label;
  tag.style.cssText = `background:var(--${topicId}-bg,#f2f2f2);color:var(--${topicId},#555);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;`;

  showScreen('quiz');
  renderQuestion(0);
}

function renderQuestion(idx) {
  answered = false;
  const q = questions[idx];
  const total = questions.length;
  document.getElementById('progress-info').textContent = `${idx + 1} / ${total}`;
  document.getElementById('progress-fill').style.width = `${(idx / total) * 100}%`;

  const letters = ['A', 'B', 'C', 'D'];
  const opts = q.options.map((o, i) => `
    <button class="opt-btn" data-i="${i}" onclick="handleAnswer(${i})">
      <span class="opt-letter">${letters[i]}</span>
      <span>${o}</span>
    </button>`).join('');

  document.getElementById('quiz-body').innerHTML = `
    <div class="q-card">
      <div class="q-meta">
        <div class="q-num">Question ${idx + 1} of ${total}</div>
        ${q.past_paper ? '<span class="past-paper-badge">📋 Past paper</span>' : ''}
      </div>
      <div class="q-text">${q.question}</div>
    </div>
    <div class="options">${opts}</div>
    <div class="explanation" id="expl"><strong>Explanation:</strong> ${q.explanation}</div>
    <button class="next-btn" id="next-btn" onclick="goNext()">
      ${idx + 1 < total ? 'Next question →' : 'See results →'}
    </button>`;
}

function handleAnswer(chosen) {
  if (answered) return;
  answered = true;
  const q = questions[currentQ];
  answers.push({ question: q.question, chosen, correct: q.correct, options: q.options });
  document.querySelectorAll('.opt-btn').forEach(btn => {
    btn.disabled = true;
    const i = parseInt(btn.dataset.i);
    if (i === q.correct) btn.classList.add('correct');
    else if (i === chosen) btn.classList.add('wrong');
  });
  document.getElementById('expl').classList.add('show');
  document.getElementById('next-btn').classList.add('show');
}

function goNext() {
  currentQ++;
  if (currentQ >= questions.length) showResults();
  else renderQuestion(currentQ);
}

document.getElementById('quiz-back').addEventListener('click', () => {
  activeTopic ? showScreen('subtopic') : showScreen('home');
});

function showResults() {
  showScreen('results');
  const correct = answers.filter(a => a.chosen === a.correct).length;
  const total = answers.length;
  const pct = Math.round((correct / total) * 100);

  document.getElementById('results-score').innerHTML = `${correct}<span>/${total}</span>`;
  document.getElementById('results-sub').textContent = `${pct}% correct`;

  let grade, gs;
  if (pct >= 80) { grade = '🏆 Excellent'; gs = 'background:var(--correct-light);color:var(--correct)'; }
  else if (pct >= 60) { grade = '👍 Good'; gs = 'background:#EAF0FB;color:#2456A4'; }
  else { grade = '📖 Keep revising'; gs = 'background:var(--wrong-light);color:var(--wrong)'; }
  const gel = document.getElementById('results-grade');
  gel.textContent = grade; gel.style.cssText = gs;

  document.getElementById('results-review').innerHTML = answers.map((a, i) => {
    const ok = a.chosen === a.correct;
    return `<div class="review-item">
      <div class="review-q">Q${i+1}. ${a.question}</div>
      ${!ok ? `<div class="review-wrong">✗ Your answer: ${a.options[a.chosen]}</div>` : ''}
      <div class="review-correct">✓ Correct: ${a.options[a.correct]}</div>
    </div>`;
  }).join('');
}

document.getElementById('btn-topics').addEventListener('click', () => showScreen('home'));
document.getElementById('btn-retry').addEventListener('click', () => {
  if (retryContext) startQuiz(retryContext.pool, retryContext.label, retryContext.topicId);
});

init();
</script>
</body>
</html>
